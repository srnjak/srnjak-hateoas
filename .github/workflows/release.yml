name: Release

# This repository has a single long-lived branch (master) plus short-lived
# dependabot branches, so there is no develop -> master promotion that could
# stand in for "cut a release". Releasing is therefore an explicit, manual
# decision: run this workflow from master when the current snapshot is ready
# to become a release.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version, e.g. 2.0.1. Leave empty to drop the -SNAPSHOT suffix from the current version.'
        required: false
        type: string
      next_version:
        description: 'Next development version without the -SNAPSHOT suffix, e.g. 2.0.2. Leave empty to increment the last version component.'
        required: false
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: srnjak/ci-builder-maven:3.9.6-jdk21-9
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Verify the workflow runs on master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Releases are cut from master only, but this run is on $GITHUB_REF." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full history for tagging

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: /root/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up environment variables
        run: |
          echo 'CENTRAL_USERNAME_PARAM=${{ vars.CENTRAL_USERNAME_PARAM }}' >> $GITHUB_ENV
          echo 'CENTRAL_PASSWORD_PARAM=${{ secrets.CENTRAL_PASSWORD_PARAM }}' >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Import GPG key
        run: echo ${{ secrets.GPG_PRIVATE_KEY }} | base64 --decode | gpg --batch --import

      - name: Build and test
        run: mvn -B clean verify -s mvn-settings.xml -Dgpg.skip=true

      - name: Prepare release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            mvn -B versions:set -s mvn-settings.xml -DgenerateBackupPoms=false -DnewVersion="$RELEASE_VERSION"
          else
            mvn -B versions:set -s mvn-settings.xml -DgenerateBackupPoms=false -DremoveSnapshot=true
          fi
          mvn -B scm:checkin -s mvn-settings.xml -Dmessage="[release] Release version prepared."

      - name: Publish to Maven Central
        run: mvn -B clean scm:tag deploy -s mvn-settings.xml -P central -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Prepare next snapshot version
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          if [ -n "$NEXT_VERSION" ]; then
            mvn -B versions:set -s mvn-settings.xml -DgenerateBackupPoms=false -DnewVersion="$NEXT_VERSION-SNAPSHOT"
          else
            mvn -B versions:set -s mvn-settings.xml -DgenerateBackupPoms=false -DnextSnapshot=true
          fi
          mvn -B scm:checkin -s mvn-settings.xml -Dmessage="[release] New snapshot version prepared."
